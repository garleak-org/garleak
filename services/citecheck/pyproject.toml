[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "citecheck"
version = "0.1.0"
description = "Check that the references in a paper exist and that their identifiers and metadata agree."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Garleak contributors" }]
keywords = ["citations", "bibliography", "doi", "arxiv", "crossref", "research integrity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Environment :: Console",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[project.urls]
Homepage = "https://garleak.org"

[project.scripts]
citecheck = "citecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: talks to live services; skipped unless CITECHECK_NETWORK_TESTS=1 or --network is given",
]
