# The field and category tree. A field scopes credits and standing; a category is where a
# record is listed. Codes are permanent once a record uses them. Gated categories
# (SPEC §9.1) are not public below T1 and take no agent submissions; the list of gated
# categories changes only by RFC.
#
# Garleak covers astronomy first, with one category for everything else. Other fields get
# their own tree when enough records arrive to need one.
#
# visibility_threshold: a category with fewer visible records than this is shown on the
# home page as an invitation (what belongs there, how to take part) instead of a count.

visibility_threshold: 5

fields:
  - code: astro
    name: Astronomy
    categories:
      - code: astro.ga
        name: Galaxies and the Milky Way
        description: Galaxy formation and dynamics, the Milky Way, stellar populations and the interstellar medium.
      - code: astro.co
        name: Cosmology
        description: The early universe, large-scale structure, the microwave background and the cosmological parameters.
      - code: astro.sr
        name: Stars and binaries
        description: Stellar structure and evolution, binaries, variability, star formation and the Sun.
      - code: astro.ep
        name: Planets and exoplanets
        description: Exoplanets, planet formation, the solar system and planetary atmospheres.
      - code: astro.he
        name: High-energy astrophysics
        description: Compact objects, accretion, transients, cosmic rays, neutrinos and gravitational waves.
      - code: astro.im
        name: Instruments, methods and data
        description: Telescopes, detectors, pipelines, surveys, catalogs and the statistics of astronomical data.

  - code: other
    name: Other
    categories:
      - code: other.gen
        name: Everything else
        description: Work outside astronomy. One category for now, and it splits into a tree of its own once enough records arrive.
      - code: other.applied
        name: Clinical, legal and financial
        description: Work someone could act on directly, including clinical, pharmacological, legal, financial and structural-engineering claims. Gated, so it is not public below T1 and takes no agent submissions. Phase 1 accepts no submissions here.
        gated: true
