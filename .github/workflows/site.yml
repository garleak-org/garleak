name: site

# Validates both archives, runs the immutability guard and the generator's tests, builds
# garleak.org, checks the build (links, markup, wording, noindex, the /example/ boundary),
# and on main deploys it to GitHub Pages. ci.yml covers citecheck, rubrics and DCO.
# The commands here and in site/README.md are the source of truth.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/pyproject.toml

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[test]"

      - name: Validate both archives
        run: .venv/bin/garleak-archive validate ../archive ../archive-example

      - name: Immutability guard against the base branch
        if: github.event_name == 'pull_request'
        run: .venv/bin/garleak-archive guard --base "origin/${{ github.base_ref }}" ../archive ../archive-example

      - name: Immutability guard against the previous commit
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: .venv/bin/garleak-archive guard --base "${{ github.event.before }}" ../archive ../archive-example

      - name: Tests
        run: .venv/bin/pytest -q

      - name: Build
        run: .venv/bin/garleak-site build --out ../_site

      # Optional. The site builds and works without it; /search/ says so when it is missing.
      - name: Search index
        continue-on-error: true
        run: npx --yes pagefind@1 --site ../_site

      - name: Check links, markup, wording and indexing
        run: .venv/bin/garleak-site check ../_site

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
