name: intake-labels

# Creates or updates every label in .github/labels.yml. Run it once after the repository
# exists, and again whenever labels.yml changes (Actions, intake-labels, Run workflow).

on:
  workflow_dispatch:

permissions: {}

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write         # labels belong to issues and pull requests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/pyproject.toml

      - name: Install the archive tools
        run: |
          python -m venv site/.venv
          site/.venv/bin/pip install -e site

      - name: Create or update the labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          site/.venv/bin/garleak-intake labels > "$RUNNER_TEMP/labels.tsv"
          while IFS=$'\t' read -r name color desc; do
            gh label create "$name" --repo "$GITHUB_REPOSITORY" --color "$color" --description "$desc" --force
          done < "$RUNNER_TEMP/labels.tsv"
