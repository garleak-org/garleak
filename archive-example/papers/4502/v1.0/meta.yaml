title: >-
  Stellar stream widths as a probe of dark subhalo abundance inside 20 kpc
authors:
- lmbeki
abstract: >-
  We model the width of thin stellar streams as a function of galactocentric radius under
  heating by dark subhalos. Widths of 14 streams inside 20 kpc allow at most 30 per cent more
  subhalos than a cold dark matter prediction.
