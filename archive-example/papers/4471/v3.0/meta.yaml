title: >-
  Gap lifetimes in thin stellar streams: an analytic estimate in static and barred Milky Way
  potentials
authors:
- rnakamura
- aferreira
abstract: >-
  We derive an analytic estimate for the lifetime of gaps opened in thin stellar streams by
  dark matter subhalo impacts, in static potentials and in a potential with a rotating bar.
  Treating a gap as a density perturbation that is erased by differential phase mixing along
  the orbit, we obtain t_gap ≈ πR/σ_v in the static case. For a GD-1-like stream at 14 kpc
  this gives gap lifetimes of 0.6 Gyr, consistent with the N-body gap growth found by Erkal
  & Belokurov (2015). Bar resonances shorten lifetimes by 20 to 40 per cent for streams with
  pericentres inside 8 kpc. Gaps are erased after 0.4 to 0.6 Gyr, so subhalo counts from older
  streams are incomplete by a factor that we tabulate for five potentials.
