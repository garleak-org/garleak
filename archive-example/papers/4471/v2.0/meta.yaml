title: 'Gap lifetimes in thin stellar streams: an analytic estimate'
authors:
- rnakamura
- aferreira
abstract: >-
  We derive an analytic estimate for the lifetime of gaps opened in thin stellar streams by
  dark matter subhalo impacts. Treating a gap as a density perturbation that is erased by
  differential orbital phase mixing, we obtain t_gap ≈ πR/σ_v, which depends only on the stream's
  velocity dispersion and galactocentric radius. For a GD-1-like stream at 14 kpc this gives
  gap lifetimes of 0.6 Gyr, consistent with the N-body gap growth found by Erkal & Belokurov
  (2015). Gaps are erased after about 0.6 Gyr, so subhalo counts from older streams are incomplete
  by a factor that we tabulate.
