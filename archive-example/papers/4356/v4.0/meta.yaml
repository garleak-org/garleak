title: >-
  Orbital decay of WASP-12b re-measured from fourteen years of transit times
authors:
- evarga
- dimai
abstract: >-
  We fit 318 transit times and 41 occultation times of WASP-12b spanning 2008 to 2025 and
  find that the orbital period is decreasing at 29.1 ± 0.9 ms per year. Apsidal precession
  is disfavoured by a Bayes factor above 1000. The decay implies a modified stellar tidal
  quality factor of (1.7 ± 0.1) × 10^5.
