title: >-
  Orbital decay of WASP-12b re-measured from fourteen years of transit times
authors:
- evarga
- dimai
abstract: >-
  We fit 212 transit times of WASP-12b spanning 2008 to 2022 and find that the orbital period
  is decreasing at 30 ± 2 ms per year. The decay implies a stellar tidal quality factor of
  about 1.8 × 10^5.
