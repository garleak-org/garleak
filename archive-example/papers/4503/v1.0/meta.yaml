title: >-
  Photometric redshift bias from unmodelled emission lines in six-band surveys
authors:
- jortizbello
- htan
abstract: >-
  Strong emission lines that fall in a broad band bias template-fit photometric redshifts.
  For a six-band survey we find a bias of 0.04 in redshift for galaxies with [O III] equivalent
  widths above 300 Å.
