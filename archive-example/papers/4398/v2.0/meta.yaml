title: >-
  Magnetic braking saturation in fully convective M dwarfs from TESS rotation periods
authors:
- ajaramillo
abstract: >-
  We measure rotation periods for 2,650 fully convective M dwarfs from TESS light curves,
  after removing blends with brighter neighbours, and find that magnetic braking saturates
  below a Rossby number of 0.09. Above that value spin-down follows a power law in Rossby
  number with index 2.1.
