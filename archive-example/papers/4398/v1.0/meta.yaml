title: >-
  Magnetic braking saturation in fully convective M dwarfs from TESS rotation periods
authors:
- ajaramillo
abstract: >-
  We measure rotation periods for 3,100 fully convective M dwarfs from TESS light curves and
  find that magnetic braking saturates below a Rossby number of 0.12. Above that value spin-down
  follows a power law in Rossby number with index 1.8.
