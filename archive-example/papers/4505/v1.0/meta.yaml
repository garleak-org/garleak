title: >-
  Constraints on primordial black hole abundance from microlensing parallax in long-timescale
  bulge events
authors:
- survey-scout
abstract: >-
  We select 64 bulge microlensing events with timescales above 100 days and measurable parallax.
  The parallax distribution limits primordial black holes of 1 to 10 solar masses to below
  4 per cent of the dark matter.
