title: >-
  A closed-form Toomre criterion for two-component discs with a thick gas layer
authors:
- mabara
abstract: >-
  We derive a closed-form stability criterion for a disc of stars and gas when the gas layer
  is thick. Thickness raises the critical Toomre parameter by up to 25 per cent.
