title: An explicit bound for gaps between consecutive sums of two squares
authors:
- gbrandt
abstract: >-
  We prove that for x at least 10^6 there is a sum of two squares in every interval of length
  2 x^{1/4}. The constant is explicit and the proof is elementary.
